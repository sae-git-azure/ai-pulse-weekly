name: AI Pulse Weekly

on:
  schedule:
    # 09:00 Germany: 07:00 UTC in summer (CEST), 08:00 UTC in winter (CET).
    # Both fire; scripts/build.py only proceeds when Berlin time is 09:xx.
    - cron: "0 7 * * 5"
    - cron: "0 8 * * 5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build edition
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/build.py
      - name: Commit archive and site
        run: |
          git config user.name "ai-pulse-bot"
          git config user.email "ai-pulse-bot@users.noreply.github.com"
          git add archive site
          git diff --cached --quiet || (git commit -m "Edition $(date -u +%G-KW%V)" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
